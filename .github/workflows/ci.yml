name: CI

on:
  push:
    branches: [ "main", "feat/remaining-offline-20261113", "feat/readability-recovery-20261114", "feat/recovery-continuity-20261114", "feat/headless-expansion-20261115", "feat/flash-recovery-complete-20261115" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ntfs:
    uses: ./.github/workflows/ntfs-checkpoints.yml
  build-and-test:
    needs: native-ntfs
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up build interpreter
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Verify bootstrap integrity controls
        run: |
          & '${{ steps.python.outputs.python-path }}' tests/BootstrapBuildTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap controls failed.' }
          & '${{ steps.python.outputs.python-path }}' tests/BootstrapNativeToolsTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Native tool bootstrap controls failed.' }
      - name: Restore checksum-pinned build dependencies
        run: |
          & '${{ steps.python.outputs.python-path }}' scripts/bootstrap-build.py --native-tools
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency restore failed.' }
      - name: Download tested native NTFS runtime
        uses: actions/download-artifact@v7
        with:
          name: native-ntfs-checkpoints
          path: .build/ci-native
      - name: Install verified native NTFS runtime
        run: |
          try {
            ./scripts/install-native-runtime.ps1 -RuntimeDirectory .build/ci-native/native-build/runtime
            if ($LASTEXITCODE -ne 0) { throw 'Native NTFS runtime installation failed.' }
          } catch {
            $nativeInstallDetail = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output ('::error title=Native runtime installation::' + $nativeInstallDetail)
            Get-ChildItem -LiteralPath .build/ci-native -Recurse -Filter runtime.json | Select-Object FullName
            exit 1
          }
      - name: Build and verify without devices or GUI
        # Native artifact is produced and tested by the reusable job above.
        run: |
          .\scripts\test-headless.ps1 -Python312 '${{ steps.python.outputs.python-path }}' -BlockNetwork
      - name: Verify packaged NTFS without Python on child PATH
        run: |
          ./scripts/package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed.' }
          & '${{ steps.python.outputs.python-path }}' tests/NativeNtfsPackagedTests.py --package dist/USB-Recovery --image .build/ci-native/native-fixtures/derived/deleted-small-mft-derived.dd --expected .build/ci-native/native-fixtures/derived/expected.bin --evidence .build/native-package-ci
          if ($LASTEXITCODE -ne 0) { throw 'Packaged NTFS validation failed.' }
          & '${{ steps.python.outputs.python-path }}' tests/NativeNtfsParentCrashTests.py --package dist/USB-Recovery --image .build/ci-native/native-fixtures/derived/deleted-small-mft-derived.dd --expected .build/ci-native/native-fixtures/derived/expected.bin --evidence .build/native-parent-crash-ci
          if ($LASTEXITCODE -ne 0) { throw 'Post-crash NTFS continuation failed.' }
          & '${{ steps.python.outputs.python-path }}' tests/NativeNtfsStreamCorpusTests.py --package dist/USB-Recovery --corpus .build/ci-native/native-stream-corpus --evidence .build/native-stream-corpus-ci
          if ($LASTEXITCODE -ne 0) { throw 'NTFS stream corpus failed.' }
          & '${{ steps.python.outputs.python-path }}' tests/NativeNtfsParentCrashTests.py --package dist/USB-Recovery --image .build/ci-native/native-stream-corpus/fragmented/image.dd --expected .build/ci-native/native-stream-corpus/fragmented/0.bin --evidence .build/native-fragmented-crash-ci
          if ($LASTEXITCODE -ne 0) { throw 'Post-crash fragmented NTFS continuation failed.' }
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-evidence
          path: |
            .build/headless-validation.json
            .build/bootstrap-build.json
            .build/headless-*/*.log
            .build/headless-*/*.manifest
            .build/native-package-ci/receipt.json
            .build/native-package-ci/*.log
            .build/native-parent-crash-ci/receipt.json
            .build/native-parent-crash-ci/*.log
            .build/native-fragmented-crash-ci/receipt.json
            .build/native-fragmented-crash-ci/*.log
            .build/native-stream-corpus-ci/receipt.json
            .build/native-stream-corpus-ci/*/*.log
          include-hidden-files: true
          retention-days: 7
