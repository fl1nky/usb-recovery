name: CI

on:
  push:
    branches: [ "main", "feat/remaining-offline-20261113", "feat/readability-recovery-20261114" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up build interpreter
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Verify bootstrap integrity controls
        run: |
          & '${{ steps.python.outputs.python-path }}' tests/BootstrapBuildTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap controls failed.' }
      - name: Restore checksum-pinned build dependencies
        run: |
          & '${{ steps.python.outputs.python-path }}' scripts/bootstrap-build.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency restore failed.' }
      - name: Build and verify without devices or GUI
        run: |
          .\scripts\test-headless.ps1 -Python312 '${{ steps.python.outputs.python-path }}' -BlockNetwork
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-evidence
          path: |
            .build/headless-validation.json
            .build/bootstrap-build.json
            .build/headless-*/*.log
            .build/headless-*/*.manifest
          include-hidden-files: true
          retention-days: 7
