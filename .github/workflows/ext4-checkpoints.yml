name: Ext4 initialization checkpoints

on:
  push:
    branches: [ "feat/flash-recovery-complete-20261115" ]
    paths:
      - 'src/**'
      - 'tests/Ext4*.cs'
      - 'tests/ext4_fixture_generator.py'
      - 'tests/fixtures/ext4/**'
      - 'scripts/build-app.ps1'
      - 'scripts/test-ext4-checkpoints.ps1'
      - '.github/workflows/ext4-checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ext4-checkpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Verify checkpoint components and native-format controls without GUI
        run: ./scripts/test-ext4-checkpoints.ps1 -Python '${{ steps.python.outputs.python-path }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ext4-initialization-evidence
          path: |
            .build/ext4-ci-evidence/*.log
            .build/ext4-ci-evidence/*.json
            .build/ext4-ci-evidence/*.manifest
          include-hidden-files: true
          retention-days: 7
