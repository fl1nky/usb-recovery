name: Recovery continuation

on:
  push:
    paths:
      - 'src/Recovery/Recovery/**'
      - 'src/Recovery/UI/**'
      - 'src/Recovery/Forensics/Bitcoin*.cs'
      - 'src/Recovery/Infrastructure/RecoveryCore.cs'
      - 'helpers/recovery_engine/resumable_copy.py'
      - 'helpers/recovery_engine/recovery_io.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/recovery-continuation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'helpers/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/recovery-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [core, flash, ext4, refs, apfs, media]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Restore checksum-pinned PhotoRec control and licenses
        if: matrix.group == 'flash'
        shell: powershell
        run: |
          python tests/BootstrapNativeToolsTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Native input boundary checks failed' }
          python scripts/bootstrap-build.py --native-only
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native inputs unavailable' }
      - name: Run continuation checks without UI or devices
        shell: powershell
        env:
          __COMPAT_LAYER: RunAsInvoker
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python).Source
          switch ('${{ matrix.group }}') {
            'core' {
              ./tests/run_test.ps1 BitcoinTraceScanTests
              foreach ($name in 'RecoveryRestartTests','SessionCheckpointSaveTests','TextCheckpointTests','TextUnicodeRecoveryTests','RecoveryContinuityTests','PhotoCheckpointSessionTests','RecoveryStageProgressTests','RecoveryRunPresentationTests') {
                ./tests/run_test.ps1 $name
              }
              ./tests/run_test.ps1 DocumentMediaPreviewTests -TestArguments @('--raster-reuse')
              ./tests/run_test.ps1 SourceRecoveryTests
              ./tests/run_test.ps1 NativeNtfsCheckpointTests -TestArguments @('.build/ntfs-cache-budget', 'Cache')
              $env:PYTHONPATH = (Resolve-Path helpers/recovery_engine).Path
              python tests/EngineTests.py EngineTests.test_many_wal_commits_use_one_replay_file EngineTests.test_nested_archives_share_one_disk_budget EngineTests.test_html_keeps_template_tokens_and_escapes_user_text
              if ($LASTEXITCODE -ne 0) { throw 'Archive resource regressions failed' }
              python tests/TelegramAutoTests.py TelegramAutoTests.test_copy_budget_counts_each_working_layout_once
              if ($LASTEXITCODE -ne 0) { throw 'Telegram copy budget regression failed' }
              python tests/ResumableCopyTests.py
              if ($LASTEXITCODE -ne 0) { throw 'Copy regressions failed' }
              python tests/ForensicImageTests.py
              if ($LASTEXITCODE -ne 0) { throw 'Image regressions failed' }
            }
            'flash' {
              ./tests/run_test.ps1 PhotoRecRunnerTests
              ./scripts/test-flash-checkpoints.ps1 -Python312 $python
            }
            'ext4' { ./scripts/test-ext4-checkpoints.ps1 -Python $python }
            'refs' { ./scripts/test-refs-checkpoints.ps1 -Python $python }
            'apfs' { ./scripts/test-apfs-checkpoints.ps1 -Python $python }
            'media' {
              python tests/JpegTwoGapRecoveryTests.py
              if ($LASTEXITCODE -ne 0) { throw 'JPEG reconstruction regression' }
              ./scripts/test-media-checkpoints.ps1 -Python $python
            }
          }
      - name: Upload small validation receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-${{ matrix.group }}
          path: |
            .build/**/receipt.json
            .build/*-validation.json
            .build/**/*.log
          if-no-files-found: ignore
